name: Cluster failover
on:
  push:
    branches: [feat/server-pool-failover]
  pull_request:
    paths:
      [
        'apps/signaling/**',
        'apps/api/**',
        'deploy/cluster/**',
        '.github/workflows/cluster-failover.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trlka_test
          POSTGRES_PASSWORD: test-only-local-database
          POSTGRES_DB: trlka_cluster_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLUSTER_TEST_DATABASE_URL: postgres://trlka_test:test-only-local-database@127.0.0.1:5432/trlka_cluster_test
      CLUSTER_TEST_BUNDLED_DIR: ${{ github.workspace }}/outputs/cluster/node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/deploy/build-cluster-artifacts.mjs
      - run: pnpm check
      - run: bash -n deploy/cluster/install-node.sh
      - name: Validate HAProxy routing configuration
        run: docker run --rm -v "$PWD/deploy/cluster/haproxy.cfg.example:/usr/local/etc/haproxy/haproxy.cfg:ro" haproxy:3.0 haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
