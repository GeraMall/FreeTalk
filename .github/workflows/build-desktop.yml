name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      signaling_url:
        description: Production WSS URL, for example wss://voice.example.com/ws
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  VITE_SIGNALING_URL: ${{ inputs.signaling_url || vars.FREETALK_SIGNALING_URL }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: pnpm --filter @freetalk/desktop tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTalk-Windows-x64
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/freetalk.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig

  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - run: pnpm --filter @freetalk/desktop tauri build --target ${{ matrix.target }} --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTalk-macOS-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
