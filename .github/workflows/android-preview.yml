name: Android iPhone-style preview
on:
  push:
    branches: [preview/android-iphone-style]
    paths: ['apps/android-native/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: |
          chmod +x apps/desktop/src-tauri/gen/android/gradlew
          apps/desktop/src-tauri/gen/android/gradlew -p apps/android-native :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Phone UI flows and phone/tablet screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash apps/android-native/scripts/capture-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TRLKA-Android-preview
          path: |
            apps/android-native/app/build/outputs/apk/debug/*.apk
            apps/android-native/app/build/reports/
            apps/android-native/app/build/outputs/androidTest-results/
            apps/android-native/build/previews/
          retention-days: 14
