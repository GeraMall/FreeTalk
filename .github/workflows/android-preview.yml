name: Android iPhone-style preview
on:
  push:
    branches: [preview/android-iphone-style]
    paths: ['apps/android-native/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: |
          chmod +x apps/desktop/src-tauri/gen/android/gradlew
          apps/desktop/src-tauri/gen/android/gradlew -p apps/android-native :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Phone UI flows and phone/tablet screenshots
        shell: bash
        run: |
          set -euo pipefail
          image='system-images;android-36;google_apis;x86_64'
          if [[ ! -x "$ANDROID_HOME/emulator/emulator" ]]; then sdkmanager emulator; fi
          for attempt in 1 2 3; do
            if sdkmanager "$image"; then break; fi
            if [[ $attempt == 3 ]]; then exit 1; fi
            sleep 5
          done
          echo no | avdmanager create avd --name trlka --package "$image" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd trlka -no-window -gpu swiftshader_indirect -noaudio -no-snapshot -no-boot-anim -camera-back emulated > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          trap 'adb emu kill || true' EXIT
          for _ in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then break; fi
            kill -0 "$pid" || { tail -100 "$RUNNER_TEMP/emulator.log"; exit 1; }
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          adb shell input keyevent 82
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global "$setting" 0; done
          bash apps/android-native/scripts/capture-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TRLKA-Android-preview
          path: |
            apps/android-native/app/build/outputs/apk/debug/*.apk
            apps/android-native/app/build/reports/
            apps/android-native/app/build/outputs/androidTest-results/
            apps/android-native/build/previews/
          retention-days: 14
