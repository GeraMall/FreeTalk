name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capacity_lab:
        description: Run isolated capacity lab instead of normal checks (no production access)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  javascript:
    if: ${{ inputs.capacity_lab != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high

  rust-security:
    if: ${{ inputs.capacity_lab != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - run: command -v cargo-audit || cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  windows-native:
    if: ${{ inputs.capacity_lab != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @freetalk/desktop build
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib malformed_screen_sdp_returns_error_without_aborting --locked

  capacity-lab:
    if: ${{ inputs.capacity_lab == true }}
    uses: ./.github/workflows/capacity-lab.yml
