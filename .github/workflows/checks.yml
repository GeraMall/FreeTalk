name: Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check published web and API from an independent network
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 --connect-timeout 10 --max-time 20 --retry 2 --fail --silent --show-error -o /tmp/trlka-index.html -w 'web status=%{http_code} bytes=%{size_download}\n' https://trlka.com/app/
          grep -o 'assets/index-[^"]*' /tmp/trlka-index.html | head -2
          curl --http1.1 --connect-timeout 10 --max-time 20 --retry 2 --fail --silent --show-error https://freetalk.191-44-38-60.sslip.io/api/health
