name: Stage verified desktop beta.232

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-v0.4.0-beta.232
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check build provenance and release draft
        run: |
          set -euo pipefail
          test "$(gh run view 44924989968 --json headSha,conclusion --jq '[.headSha, .conclusion] | join(" ")')" = 'c45a149e3f16a73f9c6f28632b499b9d384c611f success'
          test "$(gh run view 44926625371 --json headSha,conclusion --jq '[.headSha, .conclusion] | join(" ")')" = '794c120228e7673ac30dcce85b3dfa19dc1fa21d success'
          test "$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | join(" ")')" = 'true c45a149e3f16a73f9c6f28632b499b9d384c611f'
      - uses: actions/download-artifact@v4
        with:
          name: beta-windows-x64
          run-id: 44924989968
          github-token: ${{ github.token }}
          path: stage/windows
      - uses: actions/download-artifact@v4
        with:
          name: beta-macos-aarch64-apple-darwin
          run-id: 44926625371
          github-token: ${{ github.token }}
          path: stage/macos
      - name: Verify trusted updater signatures and assemble the manifest
        run: |
          set -euo pipefail
          win=stage/windows/Trlka_0.4.0-beta.232_x64-setup.exe
          mac=stage/macos/Trlka_0.4.0-beta.232_aarch64.app.tar.gz
          node scripts/windows/verify-updater.mjs "$win" "$win.sig"
          node scripts/windows/verify-updater.mjs "$mac" "$mac.sig"
          cp scripts/release/prepare-updater-232.mjs stage/
          node stage/prepare-updater-232.mjs
          cd stage
          node ../scripts/release/verify-desktop-232.mjs
      - name: Upload files to the existing draft
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" stage/windows/Trlka_0.4.0-beta.232_* stage/macos/Trlka_0.4.0-beta.232_* stage/latest.json stage/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-beta232-verified-metadata
          if-no-files-found: error
          path: |
            stage/latest.json
            stage/verified-metadata.json
            stage/SHA256SUMS.txt
