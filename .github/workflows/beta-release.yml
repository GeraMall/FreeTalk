name: Beta pre-release

on:
  push:
    # beta.224 is assembled from separately verified Mac and version-only Windows builds.
    tags: ['v*-beta.*', '!v0.4.0-beta.224']
  workflow_dispatch:
    inputs:
      include_macos:
        description: Build and publish macOS installers too
        type: boolean
        default: false
      promote_signed_224:
        description: Publish the verified beta224 platform builds without rebuilding
        type: boolean
        default: false

permissions:
  contents: read

env:
  VITE_SIGNALING_URL: ${{ vars.FREETALK_BETA_SIGNALING_URL }}
  VITE_API_URL: ${{ vars.FREETALK_BETA_API_URL }}
  VITE_INVITE_BASE_URL: https://freetalk.191-44-38-60.sslip.io
  VITE_TURNSTILE_SITE_KEY: ${{ vars.FREETALK_TURNSTILE_SITE_KEY }}

jobs:
  windows:
    if: ${{ !inputs.promote_signed_224 }}
    runs-on: windows-latest
    env:
      CXXFLAGS_x86_64_pc_windows_msvc: /DNTDDI_WIN11_GE=0x0A000010 /D_HAS_EXCEPTIONS=1 /permissive
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Windows native dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-native-v2-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-native-v2-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
        if: github.event_name != 'workflow_dispatch' || !startsWith(github.ref, 'refs/heads/preview/')
      - name: Build design preview
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/preview/')
        run: pnpm --filter @freetalk/desktop tauri build --bundles nsis --config ../../scripts/windows/tauri-local-unsigned.json
      - run: pnpm --filter @freetalk/desktop tauri build --bundles nsis
        if: github.event_name != 'workflow_dispatch' || !startsWith(github.ref, 'refs/heads/preview/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY_PASSWORD }}
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force beta-assets | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe beta-assets/
          if (Test-Path apps/desktop/src-tauri/target/release/bundle/nsis/*.sig) {
            Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.sig beta-assets/
          }
          Copy-Item apps/desktop/src-tauri/target/release/freetalk.exe "beta-assets/Trlka_${version}_portable_x64.exe"
      - uses: actions/upload-artifact@v4
        with: { name: beta-windows-x64, path: beta-assets/*, if-no-files-found: error }

  macos:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_macos == true) || github.ref_name == 'v0.4.0-beta.194' || github.ref_name == 'v0.4.0-beta.197' || github.ref_name == 'v0.4.0-beta.200' || github.ref_name == 'v0.4.0-beta.201' || github.ref_name == 'v0.4.0-beta.203' || github.ref_name == 'v0.4.0-beta.204' || github.ref_name == 'v0.4.0-beta.205' || github.ref_name == 'v0.4.0-beta.221' || github.ref_name == 'v0.4.0-beta.223' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-26 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - run: pnpm install --frozen-lockfile
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - run: pnpm --filter @freetalk/desktop tauri build --target ${{ matrix.target }} --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY_PASSWORD }}
      - name: Verify macOS runtime paths
        run: |
          app_path=$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          executable="$app_path/Contents/MacOS/freetalk"
          test -x "$executable"
          otool -L "$executable"
          if ! otool -l "$executable" | grep -A3 LC_RPATH | grep -q "path /usr/lib/swift"; then
            echo "Missing /usr/lib/swift LC_RPATH; packaged app would crash before launch" >&2
            exit 1
          fi
      - name: Package macOS app
        run: |
          mkdir -p beta-assets
          version=$(node -p "require('./package.json').version")
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) release_arch=aarch64 ;;
            x86_64-apple-darwin) release_arch=x64 ;;
          esac
          app_path=$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "beta-assets/Trlka-${{ matrix.target }}.app.zip"
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg beta-assets/
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz "beta-assets/Trlka_${version}_${release_arch}.app.tar.gz"
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig "beta-assets/Trlka_${version}_${release_arch}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: beta-macos-${{ matrix.target }}
          if-no-files-found: error
          path: beta-assets/*

  prerelease:
    permissions:
      contents: write
    if: >-
      ${{
        always() &&
        startsWith(github.ref, 'refs/tags/') &&
        needs.windows.result == 'success' &&
        (needs.macos.result == 'success' || needs.macos.result == 'skipped')
      }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets }
      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          windows_file=$(find release-assets -name "Trlka_${version}_x64-setup.exe" -print -quit)
          test -f "$windows_file"
          test -f "$windows_file.sig"

          platforms=$(jq -n \
            --arg windows_signature "$(cat "$windows_file.sig")" \
            --arg windows_url "$base_url/$(basename "$windows_file")" \
            '{
              "windows-x86_64": { signature: $windows_signature, url: $windows_url }
            }')

          arm_file=$(find release-assets -name "Trlka_${version}_aarch64.app.tar.gz" -print -quit)
          intel_file=$(find release-assets -name "Trlka_${version}_x64.app.tar.gz" -print -quit)
          if [[ -n "$arm_file" ]]; then
            test -f "$arm_file.sig"
            platforms=$(jq -n \
              --argjson platforms "$platforms" \
              --arg arm_signature "$(cat "$arm_file.sig")" \
              --arg arm_url "$base_url/$(basename "$arm_file")" \
              '$platforms + {"darwin-aarch64": {signature: $arm_signature, url: $arm_url}}')
          fi

          jq -n \
            --arg version "$version" \
            --arg notes "TRLKA ${version}: fixed room chat layout and improved macOS screen-share clarity in video mode; screen-share restart issue on Mac remains under investigation." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: $platforms
            }' > release-assets/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.ref_name == 'v0.4.0-beta.194' || github.ref_name == 'v0.4.0-beta.189' || github.ref_name == 'v0.4.0-beta.197' || github.ref_name == 'v0.4.0-beta.200' || github.ref_name == 'v0.4.0-beta.201' || github.ref_name == 'v0.4.0-beta.203' || github.ref_name == 'v0.4.0-beta.204' || github.ref_name == 'v0.4.0-beta.205' || github.ref_name == 'v0.4.0-beta.221' || github.ref_name == 'v0.4.0-beta.223' }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/**/*

  promote-224:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_signed_224 == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: beta-windows-x64
          run-id: 42514068028
          github-token: ${{ github.token }}
          path: verified-assets
      - name: Verify exact build provenance and updater signatures
        shell: bash
        run: |
          set -euo pipefail
          gh run view 42514068028 --json conclusion,headSha > windows-source.json
          gh release view v0.4.0-beta.224 --json isDraft,targetCommitish,assets > release-state.json
          gh release download v0.4.0-beta.224 --pattern 'Trlka_0.4.0-beta.224_aarch64.app.tar.gz*' --dir verified-assets
          node scripts/windows/verify-updater.mjs verified-assets/Trlka_0.4.0-beta.224_x64-setup.exe verified-assets/Trlka_0.4.0-beta.224_x64-setup.exe.sig
          node scripts/windows/verify-updater.mjs verified-assets/Trlka_0.4.0-beta.224_aarch64.app.tar.gz verified-assets/Trlka_0.4.0-beta.224_aarch64.app.tar.gz.sig
          node <<'NODE'
          const fs = require('node:fs'), assert = require('node:assert/strict'), crypto = require('node:crypto');
          const source = JSON.parse(fs.readFileSync('windows-source.json'));
          assert.equal(source.conclusion, 'success');
          assert.equal(source.headSha, '11faca7ac813d63424168dbcee53abe5e03a21e8');
          const release = JSON.parse(fs.readFileSync('release-state.json'));
          assert.equal(release.isDraft, true);
          assert.equal(release.targetCommitish, '3e7b11d31c209adc8d3ff03e6da328eb70b2ba92');
          assert(release.assets.some(a => a.name === 'Trlka_0.4.0-beta.224_aarch64.dmg' && a.size === 45907991));
          const version = '0.4.0-beta.224', base = `https://github.com/GeraMall/FreeTalk/releases/download/v${version}/`;
          const win = `Trlka_${version}_x64-setup.exe`, mac = `Trlka_${version}_aarch64.app.tar.gz`, portable = `Trlka_${version}_portable_x64.exe`;
          const read = n => fs.readFileSync('verified-assets/' + n);
          for (const name of [win, portable]) assert.equal(read(name).subarray(0, 2).toString(), 'MZ');
          assert(read(portable).includes(Buffer.from(version + '\0', 'utf16le')));
          const hash = n => crypto.createHash('sha256').update(read(n)).digest('hex');
          assert.equal(hash(mac), 'a2022fe7cc710f976466913b79ba53318c09c497d04619b30785f515909a3463');
          const manifest = {version, notes: 'TRLKA beta.224: macOS source capture resolution fix and Mac-specific default profile; Windows version number only. Mac screen-share restart and system audio issues remain under investigation.', pub_date: new Date().toISOString(), platforms: {
            'windows-x86_64': {signature: read(win + '.sig').toString().trim(), url: base + win},
            'darwin-aarch64': {signature: read(mac + '.sig').toString().trim(), url: base + mac}
          }};
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2) + '\n');
          const metadata = [win, portable, mac].map(name => ({name, bytes: read(name).length, sha256: hash(name)}));
          fs.writeFileSync('verified-metadata.json', JSON.stringify(metadata, null, 2));
          console.log('MANIFEST_B64=' + Buffer.from(JSON.stringify(manifest)).toString('base64'));
          console.log('VERIFIED_METADATA=' + JSON.stringify(metadata));
          NODE
      - name: Publish approved beta224 release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.4.0-beta.224 verified-assets/Trlka_0.4.0-beta.224_x64-setup.exe verified-assets/Trlka_0.4.0-beta.224_x64-setup.exe.sig verified-assets/Trlka_0.4.0-beta.224_portable_x64.exe latest.json --clobber
          gh release edit v0.4.0-beta.224 --draft=false --latest
          gh release view v0.4.0-beta.224 --json isDraft,isPrerelease,tagName
      - uses: actions/upload-artifact@v4
        with:
          name: beta224-verified-metadata
          path: |
            latest.json
            verified-metadata.json
