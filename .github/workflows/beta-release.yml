name: Beta pre-release

on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SIGNALING_URL: ${{ vars.FREETALK_BETA_SIGNALING_URL }}
  VITE_API_URL: ${{ vars.FREETALK_BETA_API_URL }}
  VITE_INVITE_BASE_URL: https://freetalk.191-44-38-60.sslip.io
  VITE_TURNSTILE_SITE_KEY: ${{ vars.FREETALK_TURNSTILE_SITE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FREETALK_UPDATER_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: pnpm --filter @freetalk/desktop tauri build --bundles nsis
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force beta-assets | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe beta-assets/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.sig beta-assets/
          Copy-Item apps/desktop/src-tauri/target/release/freetalk.exe "beta-assets/FreeTalk_${version}_portable_x64.exe"
      - uses: actions/upload-artifact@v4
        with: { name: beta-windows-x64, path: beta-assets/*, if-no-files-found: error }

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-26 }
          - { target: x86_64-apple-darwin, runner: macos-26-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - run: pnpm install --frozen-lockfile
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - run: pnpm --filter @freetalk/desktop tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: Verify macOS runtime paths
        run: |
          app_path=$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          executable="$app_path/Contents/MacOS/freetalk"
          test -x "$executable"
          otool -L "$executable"
          if ! otool -l "$executable" | grep -A3 LC_RPATH | grep -q "path /usr/lib/swift"; then
            echo "Missing /usr/lib/swift LC_RPATH; packaged app would crash before launch" >&2
            exit 1
          fi
      - name: Package macOS app
        run: |
          mkdir -p beta-assets
          version=$(node -p "require('./package.json').version")
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) release_arch=aarch64 ;;
            x86_64-apple-darwin) release_arch=x64 ;;
          esac
          app_path=$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "beta-assets/FreeTalk-${{ matrix.target }}.app.zip"
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg beta-assets/
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz "beta-assets/FreeTalk_${version}_${release_arch}.app.tar.gz"
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig "beta-assets/FreeTalk_${version}_${release_arch}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: beta-macos-${{ matrix.target }}
          if-no-files-found: error
          path: beta-assets/*

  prerelease:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets }
      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          windows_file=$(find release-assets -name "FreeTalk_${version}_x64-setup.exe" -print -quit)
          arm_file=$(find release-assets -name "FreeTalk_${version}_aarch64.app.tar.gz" -print -quit)
          intel_file=$(find release-assets -name "FreeTalk_${version}_x64.app.tar.gz" -print -quit)
          test -f "$windows_file"
          test -f "$windows_file.sig"
          test -f "$arm_file"
          test -f "$arm_file.sig"
          test -f "$intel_file"
          test -f "$intel_file.sig"
          jq -n \
            --arg version "$version" \
            --arg notes "FreeTalk ${version}: новое меню сообщений, ответы, закрепление, пересылка, реакции и поиск GIF в чатах." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_signature "$(cat "$windows_file.sig")" \
            --arg windows_url "$base_url/$(basename "$windows_file")" \
            --arg arm_signature "$(cat "$arm_file.sig")" \
            --arg arm_url "$base_url/$(basename "$arm_file")" \
            --arg intel_signature "$(cat "$intel_file.sig")" \
            --arg intel_url "$base_url/$(basename "$intel_file")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $windows_signature, url: $windows_url },
                "darwin-aarch64": { signature: $arm_signature, url: $arm_url },
                "darwin-x86_64": { signature: $intel_signature, url: $intel_url }
              }
            }' > release-assets/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-assets/**/*
