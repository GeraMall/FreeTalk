name: Coursework operations and recovery lab
on:
  push:
    branches: [coursework/stages-3-4-20261120]
    paths: ['scripts/coursework/operations-lab.sh', '.github/workflows/coursework-operations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare lab tools
        run: |
          if ! command -v wg >/dev/null || ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update -qq
            sudo apt-get install -y wireguard-tools postgresql-16
          fi
      - name: Check isolation, monitoring, backup and recovery
        run: sudo --preserve-env=GITHUB_ACTIONS env TRLKA_COURSE_LAB=isolated-ci bash scripts/coursework/operations-lab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coursework-operations-evidence
          path: output/coursework-operations/
          if-no-files-found: warn
