<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><title>Android call interop</title>
  <body>
    <button id="start">Начать проверку соединения</button>
    <pre id="status">Ожидание</pre>
    <script type="module">
      const status = document.querySelector('#status');
      const bridge = 'http://127.0.0.1:18898';
      const post = async (path, value) => {
        const r = await fetch(bridge + path, {
          method: 'POST',
          headers: { 'content-type': 'text/plain' },
          body: JSON.stringify(value),
        });
        if (!r.ok) throw Error('Bridge ' + r.status);
        return r.json();
      };
      document.querySelector('#start').onclick = async () => {
        const audioContext = new AudioContext();
        await audioContext.resume();
        let manager,
          polling = false,
          poll = Promise.resolve();
        try {
          const ice = window.interopIce;
          if (!ice?.iceServers) throw Error('ICE fixture missing');
          await post('/message', ice);
          const { PeerManager } = await import('/src/lib/peer-manager.ts');
          const source = audioContext.createOscillator(),
            gain = audioContext.createGain(),
            destination = audioContext.createMediaStreamDestination();
          gain.gain.value = 0;
          source.connect(gain);
          gain.connect(destination);
          source.start();
          const android = '11111111-1111-4111-8111-111111111111',
            self = '22222222-2222-4222-8222-222222222222';
          let sendQueue = Promise.resolve();
          const events = { tracks: 0, states: [] };
          manager = new PeerManager(
            self,
            ice.iceServers,
            destination.stream,
            (message) => {
              sendQueue = sendQueue
                .then(() => post('/message', { ...message, from: self }))
                .catch((e) => {
                  events.error = String(e);
                });
            },
            { onTrack: () => events.tracks++, onState: (_, state) => events.states.push(state) },
          );
          const pc = manager.ensure(android);
          if (window.forceRelay) {
            pc.setConfiguration({ ...pc.getConfiguration(), iceTransportPolicy: 'relay' });
            pc.restartIce();
          }
          polling = true;
          poll = (async () => {
            while (polling) {
              const messages = await (await fetch(bridge + '/poll')).json();
              for (const m of messages)
                if (['offer', 'answer', 'ice-candidate'].includes(m.type)) await manager.handle(m);
              await new Promise((r) => setTimeout(r, 100));
            }
          })();
          const deadline = performance.now() + 60000;
          let latest = {};
          while (performance.now() < deadline) {
            const native = await (await fetch(bridge + '/status')).json();
            const stats = await pc.getStats();
            let received = 0,
              sent = 0,
              localCandidateType = null,
              remoteCandidateType = null;
            stats.forEach((s) => {
              if (s.type === 'inbound-rtp' && s.kind === 'audio')
                received += s.packetsReceived || 0;
              if (s.type === 'outbound-rtp' && s.kind === 'audio') sent += s.packetsSent || 0;
              if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated) {
                localCandidateType = stats.get(s.localCandidateId)?.candidateType;
                remoteCandidateType = stats.get(s.remoteCandidateId)?.candidateType;
              }
            });
            latest = {
              browser: pc.connectionState,
              ice: pc.iceConnectionState,
              native,
              received,
              sent,
              localCandidateType,
              remoteCandidateType,
              events,
            };
            status.textContent = JSON.stringify(latest, null, 2);
            if (
              pc.connectionState === 'connected' &&
              native.connected &&
              received > 0 &&
              sent > 0
            ) {
              latest.passed = true;
              break;
            }
            await new Promise((r) => setTimeout(r, 500));
          }
          latest.passed = latest.passed === true;
          window.interopResult = latest;
          status.textContent = JSON.stringify(latest, null, 2);
          polling = false;
          await poll.catch(() => {});
          await post('/done', { passed: latest.passed });
        } catch (e) {
          window.interopResult = { passed: false, error: String(e) };
          status.textContent = JSON.stringify(window.interopResult);
          await post('/done', { passed: false }).catch(() => {});
        } finally {
          polling = false;
          manager?.closeAll();
          await audioContext.close();
        }
      };
    </script>
  </body>
</html>
