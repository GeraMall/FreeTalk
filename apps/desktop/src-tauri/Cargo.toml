[package]
name = "freetalk"
version = "0.4.0-beta.100"
description = "FreeTalk desktop voice chat"
authors = ["FreeTalk contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "freetalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
freetalk-secure-session = { path = "plugins/secure-session" }
fs2 = "0.4"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
