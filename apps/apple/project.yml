name: TRLKA
options:
  bundleIdPrefix: com.trlka
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  TRLKACore:
    path: Packages/TRLKACore
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: Configuration/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: TRLKA
    TRLKA_API_BASE_URL: https://freetalk.191-44-38-60.sslip.io/api
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TRLKA-iOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TRLKACore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trlka.ios
        PRODUCT_NAME: TRLKA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TRLKA-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Configuration/TRLKA.icns
        buildPhase: resources
    dependencies:
      - package: TRLKACore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trlka.macos
        PRODUCT_NAME: TRLKA
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64 x86_64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_CFBundleIconFile: TRLKA
